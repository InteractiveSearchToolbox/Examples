<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Search Toolbox</title>
    <link type="text/css" rel="stylesheet" href="styles.css">
    <style>
        body {
            background-color: #c7c7c7;
        }

        #debugGridToggle {
            position: fixed;
            top: 10px;
            left: 10px;
            max-width: 25%;
            max-height: 40%;
            overflow: scroll;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.85);
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 14px;
            display: flex;
            flex-direction: column;
            align-items: start;
            visibility: hidden;
            gap: 6px;
        }


        .settingsRow {
            display: flex;
            gap: 5px;
            width: 100%;
            align-items: center;
            flex-wrap: nowrap;
            font-size: x-small;
        }

        .settingsRow label {
            flex: 0 0 auto;
            white-space: nowrap;
        }

        .settingsRow input {
            flex: 1 1 0;
            min-width: 0;
            box-sizing: border-box;
            width: 100%;
        }

        #controlSettings {
            display: none;
        }

        #controlInstructions{
            font-size: x-small;
        }
    </style>

    <script type="module" src="IST.min.js"></script>
</head>

<body>
    <div id="debugGridToggle">
        <div>
            <b>Select control type:</b>
            <select name="controls" id="controlList">
                <option value="" selected disabled hidden></option>
                <option value="orbit">Orbit</option>
                <option value="dragToRotate">Drag to Rotate</option>
                <option value="drag">Drag and Drop</option>
                <option value="firstPerson">First Person</option>
                <option value="maskOpaque">Mask</option>
                <option value="maskBlur">Mask (Blur)</option>
            </select>
        </div>
        <div>
            <b>Description:</b>
            <div id="controlInstructions"></div>
        </div>
        <div id='controlSettings'>
            <b>Settings:</b>
            <div id="dragToRotateSettings">
                <div class="settingsRow">
                    <label for="dragToRotateSensitivity">Cursor Sensitivity</label>
                    <input id='dragToRotateSensitivity' name='dragToRotateSensitivity' type="number" value=200>
                </div>
            </div>
            <div id="maskControlSettings">
                <div class="settingsRow" id="maskColourRow">
                    <label for="maskColour">Mask Colour</label>
                    <input id='maskColour' name='maskColour' value="#ff0000" type="color">
                </div>
                <div class="settingsRow" id="maskOpacityRow">
                    <label for="maskOpacity">Mask Opacity</label>
                    <input id='maskOpacity' name='maskOpacity' type="range" min="0" max="1" step=0.1 value=1>
                </div>
                <div class="settingsRow">
                    <label for="maskRadius">Mask Radius</label>
                    <input id='maskRadius' name='maskRadius' type="number" value=0.1 step=0.025>
                </div>
                <div class="settingsRow">
                    <label for="maskFeather">Mask Feather</label>
                    <input id='maskFeather' name='maskFeather' type="number" value=0.05 step=0.0025>
                </div>
                <div class="settingsRow" id="blurRow">
                    <label for="blurIntensity">Blur Intensity</label>
                    <input id='blurIntensity' name='blurIntensity' type="number" value=2>
                </div>

                <div class="settingsRow" id="blurPassesRow">
                    <label for="blurPasses">No. Blur Passes</label>
                    <input id='blurPasses' name='blurPasses' type="number" value=4>
                </div>
            </div>

        </div>

    </div>
    <script type="module">
        // EXAMPLES OF ALL AVAILABLE INTERACTIVE CONTROLS

        const IST = new InteractiveSearchToolbox({
            threeAddons: [["Sky", 'three/addons/objects/Sky.js']]
        })
        await IST.init()

        IST.turnOnLoadingScreen("Loading, please wait...");



        const showDebugGridToggle = document.getElementById('debugGridToggle');
        const controlList = document.getElementById('controlList');
        const dragToRotateSettings = document.getElementById('dragToRotateSettings')
        const maskControlSettings = document.getElementById('maskControlSettings')
        const controlSettings = document.getElementById('controlSettings')
        const controlInstructions = document.getElementById('controlInstructions')

        const maskColourRow = document.getElementById('maskColourRow')
        const maskOpacityRow = document.getElementById('maskOpacityRow')

        const blurRow = document.getElementById('blurRow')
        const blurPassesRow = document.getElementById('blurPassesRow')

        const dragToRotateSensitivity = document.getElementById('dragToRotateSensitivity')
        const maskColour = document.getElementById('maskColour')
        const maskOpacity = document.getElementById('maskOpacity')
        const maskRadius = document.getElementById('maskRadius')
        const maskFeather = document.getElementById('maskFeather')
        const blurIntensity = document.getElementById('blurIntensity')
        const blurPasses = document.getElementById('blurPasses')


        dragToRotateSensitivity.addEventListener('input', (event) => { IST.setOverallDragToRotateSensitivity(event.target.value) })
        maskColour.addEventListener('input', (event) => { IST.setMaskColour(event.target.value) })
        maskOpacity.addEventListener('input', (event) => { IST.setMaskColour(maskColour.value, event.target.value) })
        maskRadius.addEventListener('input', (event) => { IST.setMaskRadius(event.target.value, maskFeather.value) })
        maskFeather.addEventListener('input', (event) => { IST.setMaskRadius(maskRadius.value, event.target.value) })
        blurIntensity.addEventListener('input', (event) => { IST.setBlurIntensity(event.target.value) })
        blurPasses.addEventListener('input', (event) => {
            IST.enableMaskControls({ maskType: 'blur', numberOfBlurPasses: event.target.value })
            IST.setMaskRadius(maskRadius.value, maskFeather.value)
            IST.setBlurIntensity(blurIntensity.value)
        })



        controlList.addEventListener('input', function (event) {
            const value = event.target.value;

            controlSettings.style.display = 'none';
            dragToRotateSettings.style.display = 'none';
            maskControlSettings.style.display = 'none';

            maskColourRow.style.display = 'none';
            maskOpacityRow.style.display = 'none';
            blurRow.style.display = 'none';
            blurPassesRow.style.display = 'none';

            switch (value) {
                case "dragToRotate":
                    IST.enableDragToRotateControls();
                    IST.setOverallDragToRotateSensitivity(dragToRotateSensitivity.value)
                    controlSettings.style.display = 'block';
                    dragToRotateSettings.style.display = 'block';
                    controlInstructions.innerText = "Use the cursor rotate objects in the scene by clicking and dragging on them. Objects will rotate in place. The speed at which these rotate can be varied by changing the cursor sensitivity."
                    break;
                case "drag":
                    IST.enableDragControls();
                    controlInstructions.innerText = "Use the cursor to drag and drop objects around the scene. Click and hold on objects using your left mouse/cursor button."
                    break;
                case "firstPerson":
                    IST.enableFirstPersonControls();
                    controlInstructions.innerText = "In first person controls, the camera can be rotated in place to 'look around' the scene. Left click and drag anywhere in the scene to look around."
                    break;
                case "maskOpaque":
                    IST.enableMaskControls({ maskType: 'opaque', colour: maskColour.value, opacity: maskOpacity.value })
                    IST.setMaskRadius(maskRadius.value, maskFeather.value)
                    controlSettings.style.display = 'block';
                    maskControlSettings.style.display = 'block';
                    maskColourRow.style.display = 'flex';
                    maskOpacityRow.style.display = 'flex';
                    controlInstructions.innerText = "Description: Mask text."
                    break;
                case "maskBlur":
                    IST.enableMaskControls({ maskType: 'blur', numberOfBlurPasses: blurPasses.value }) // Opaque mask
                    IST.setMaskRadius(maskRadius.value, maskFeather.value)
                    IST.setBlurIntensity(blurIntensity.value)
                    controlSettings.style.display = 'block';
                    maskControlSettings.style.display = 'block';
                    blurRow.style.display = 'flex';
                    blurPassesRow.style.display = 'flex';

                    controlInstructions.innerText = "Description: Blur mask text."
                    break;
                default:
                    // Orbit
                    IST.enableOrbitControls();
                    controlInstructions.innerHTML = "Orbit controls allows the camera to orbit around a point within the scene. Use the cursor to click and drag to rotate and pan, and the scroll wheel to zoom in and out. Orbit controls is a wrapper of the <a href = 'https://threejs.org/docs/#OrbitControls' target = blank >three.js orbit controls class</a>, as such, any settings that need to be changed (e.g., camera target) must be done so through the <i><b>IST.orbitControls</b></i> variable."
                    break;
            }
        })




        const modelsToLoad = ['Models/L.glb', 'Models/T.glb', 'Models/TARGET_CUBE.glb', 'Models/Brick.glb', 'Models/HelloWorld.glb']

        IST.preLoadModels(modelsToLoad)
        IST.preloadHDRI(['Textures/InteractiveControls/puresky.hdr'], true) // Setting the second arguement to true automatically applies the HDRI to our scene.

        IST.onPreloadFinished(function () {
            IST.scene.background = IST.findLoadedTexture('puresky', IST.loadedEnvs)
            IST.scene.fog = new THREE.FogExp2(0xcccccc, 0.002);

            function setupTrial() {
                IST.camera.position.z = 50;

                const cubeStimuli = []
                for (let i = 0; i < 250; i++) {
                    const cubeGeometry = new THREE.BoxGeometry(1, 1, 1);
                    const cubeMaterial = new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff });
                    const cube = new THREE.Mesh(cubeGeometry, cubeMaterial);
                    cubeStimuli.push(cube)
                    //IST.addStimulusToScene(cube)
                }


                IST.placeRandomly3D({
                    objectsToPlace: cubeStimuli,
                    randomRotation: true,
                    spread: 15,
                    ignoreCollisions: true // If set to true they can overlap and clip
                });

            }

            // Instruction trial is where we would provide instructions on how to complete the experiment.
            const INSTRUCTION_TRIAL = {
                type: jsPsychHtmlButtonResponse,
                on_start() {
                },
                stimulus: `
                <h3>Welcome!</h3>
                When you are ready to start, press the button below!
                `,
                on_finish(data) {
                },
                choices: ['Start Experiment']
            }

            const SEARCH_TRIAL = {
                type: jsPsychHtmlKeyboardResponse,
                on_start() {
                    setupTrial(); // Gets all the stimuli adds them to the scene and enables choice of controls
                    IST.startTrial(); // We call this to start the trial - This is extremely important.
                    showDebugGridToggle.style.visibility = 'visible';
                },
                stimulus: '', // We tell jspsych not to show anything for the trial, we handle that with the IST instead. 
                on_finish() {
                    IST.endTrial(); // Call this at the end of every trial - This is extremely important. 
                },
                choices: ['z', 'm']
            }


            IST.turnOffLoadingScreen();

            jsPsych.run([INSTRUCTION_TRIAL, SEARCH_TRIAL]) // Run experiment
        }
        );




    </script>
</body>

</html>
