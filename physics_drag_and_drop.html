      function createBucket(mesh, type = "trimesh") {
        const position = new THREE.Vector3();
        mesh.getWorldPosition(position);
        const quaternion = mesh.quaternion;

        const rigidBodyDesc = RAPIER.RigidBodyDesc.fixed()
          .setTranslation(position.x, position.y, position.z)
          .setRotation({ x: quaternion.x, y: quaternion.y, z: quaternion.z, w: quaternion.w });

        const rigidBody = world.createRigidBody(rigidBodyDesc);

        if (type === "cuboid") {
          mesh.geometry.computeBoundingBox();
          const size = new THREE.Vector3();
          const center = new THREE.Vector3();
          mesh.geometry.boundingBox.getSize(size);
          mesh.geometry.boundingBox.getCenter(center);
          size.divideScalar(2); // half-extents

          // Transform the local center offset into world space
          center.applyMatrix4(mesh.matrixWorld);

          const rigidBodyDesc = RAPIER.RigidBodyDesc.fixed()
            .setTranslation(center.x, center.y, center.z)  // use center, not position
            .setRotation({ x: quaternion.x, y: quaternion.y, z: quaternion.z, w: quaternion.w });

          const rigidBody = world.createRigidBody(rigidBodyDesc);
          const colliderDesc = RAPIER.ColliderDesc.cuboid(size.x, size.y, size.z);
          world.createCollider(colliderDesc, rigidBody);

          return rigidBody;

        } else {
          // Extract vertices and indices for trimesh
          const geo = mesh.geometry.index ? mesh.geometry.clone() : mesh.geometry;
          const positionAttr = geo.attributes.position;

          const vertices = new Float32Array(positionAttr.count * 3);
          for (let i = 0; i < positionAttr.count; i++) {
            vertices[i * 3] = positionAttr.getX(i);
            vertices[i * 3 + 1] = positionAttr.getY(i);
            vertices[i * 3 + 2] = positionAttr.getZ(i);
          }

          let indices;
          if (geo.index) {
            indices = new Uint32Array(geo.index.array);
          } else {
            indices = new Uint32Array(positionAttr.count);
            for (let i = 0; i < positionAttr.count; i++) indices[i] = i;
          }

          const colliderDesc = RAPIER.ColliderDesc.trimesh(vertices, indices);
          world.createCollider(colliderDesc, rigidBody);
        }

        return rigidBody;
      }

      function createShuffler(rootMesh, spawnPosition, useConvexHull = false) {
        // Create the single kinematic rigid body at the root's spawn position
        let rigidBodyDesc = RAPIER.RigidBodyDesc.kinematicPositionBased()
          .setTranslation(spawnPosition.x, spawnPosition.y, spawnPosition.z);
        rigidBodyDesc.setRotation(
          { x: rootMesh.quaternion.x, y: rootMesh.quaternion.y, z: rootMesh.quaternion.z, w: rootMesh.quaternion.w },
          true
        );

        const rigidBody = world.createRigidBody(rigidBodyDesc);
        rigidBody.lockRotations(true, true);

        // Make sure local transforms are current before we read them
        rootMesh.updateWorldMatrix(true, true);

        const colliders = [];

        rootMesh.traverse((child) => {
          if (!child.isMesh || !child.geometry) return;

          // Get this child's transform RELATIVE TO rootMesh (the rigid body's frame),
          // not relative to world space.
          const localMatrix = new THREE.Matrix4().copy(child.matrixWorld);
          localMatrix.premultiply(new THREE.Matrix4().copy(rootMesh.matrixWorld).invert());

          const localPos = new THREE.Vector3();
          const localQuat = new THREE.Quaternion();
          const localScale = new THREE.Vector3();
          localMatrix.decompose(localPos, localQuat, localScale);

          let colliderDesc;

          if (useConvexHull) {
            const position = child.geometry.attributes.position;
            const points = new Float32Array(position.array);
            colliderDesc = RAPIER.ColliderDesc.convexHull(points);

            if (!colliderDesc) {
              console.warn("Convex hull failed for", child.name, "- falling back to bounding sphere");
              child.geometry.computeBoundingSphere();
              colliderDesc = RAPIER.ColliderDesc.ball(child.geometry.boundingSphere.radius);
            }
          } else {
            child.geometry.computeBoundingSphere();
            colliderDesc = RAPIER.ColliderDesc.ball(child.geometry.boundingSphere.radius);
          }

          // Position/orient this collider relative to the rigid body
          colliderDesc.setTranslation(localPos.x, localPos.y, localPos.z);
          colliderDesc.setRotation({ x: localQuat.x, y: localQuat.y, z: localQuat.z, w: localQuat.w });

          const collider = world.createCollider(colliderDesc, rigidBody);
          colliders.push(collider);
        });

        rootMesh.position.copy(rigidBody.translation());
        rootMesh.quaternion.copy(rigidBody.rotation());

        physicsIDs += 1;
        const ID = physicsIDs;

        const physicsObject = { RB: rigidBody, COLLIDER: colliders, MESH: rootMesh, ID: ID };

        return physicsObject;
      }

      function createPhysicsObject(mesh, type = "cuboid") {
        let rigidBodyDesc, colliderDesc;

        const position = new THREE.Vector3()
        mesh.getWorldPosition(position);
        const quaternion = mesh.quaternion;

        // Helper to set up a dynamic rigid body at the mesh's transform
        function makeRigidBody() {
          const desc = RAPIER.RigidBodyDesc.dynamic();
          desc.setTranslation(position.x, position.y, position.z);
          desc.setRotation({ x: quaternion.x, y: quaternion.y, z: quaternion.z, w: quaternion.w });
          return desc;
        }

        if (type === "cuboid") {
          const size = new THREE.Vector3();
          mesh.geometry.computeBoundingBox();
          mesh.geometry.boundingBox.getSize(size);
          size.divideScalar(2);

          rigidBodyDesc = makeRigidBody();
          colliderDesc = RAPIER.ColliderDesc.cuboid(size.x, size.y, size.z);

        } else if (type === "ball") {
          mesh.geometry.computeBoundingSphere();
          const radius = mesh.geometry.boundingSphere.radius;

          rigidBodyDesc = makeRigidBody();
          colliderDesc = RAPIER.ColliderDesc.ball(radius);

        } else if (type === "capsule") {
          // Capsule is oriented along Y by default in Rapier.
          // halfHeight is the half-length of the cylindrical shaft (excluding the two end caps).
          mesh.geometry.computeBoundingBox();
          const size = new THREE.Vector3();
          mesh.geometry.boundingBox.getSize(size);

          const radius = Math.max(size.x, size.z) / 2;
          const halfHeight = Math.max(0, (size.y / 2) - radius);

          rigidBodyDesc = makeRigidBody();
          colliderDesc = RAPIER.ColliderDesc.capsule(halfHeight, radius);

        } else if (type === "convex") {
          // Extract world-space vertex positions from the geometry
          const positionAttr = mesh.geometry.attributes.position;
          const vertices = new Float32Array(positionAttr.count * 3);
          for (let i = 0; i < positionAttr.count; i++) {
            vertices[i * 3] = positionAttr.getX(i);
            vertices[i * 3 + 1] = positionAttr.getY(i);
            vertices[i * 3 + 2] = positionAttr.getZ(i);
          }

          rigidBodyDesc = makeRigidBody();
          colliderDesc = RAPIER.ColliderDesc.convexHull(vertices);
          if (!colliderDesc) {
            console.warn("convexHull failed — falling back to cuboid for", mesh.name);
            mesh.geometry.computeBoundingBox();
            const size = new THREE.Vector3();
            mesh.geometry.boundingBox.getSize(size);
            size.divideScalar(2);
            colliderDesc = RAPIER.ColliderDesc.cuboid(size.x, size.y, size.z);
          }

        } else if (type === "trimesh") {
          // Extract vertices and triangle indices from the geometry
          const geo = mesh.geometry.index
            ? mesh.geometry.clone() // keep indexed form
            : mesh.geometry;

          const positionAttr = geo.attributes.position;
          const vertices = new Float32Array(positionAttr.count * 3);
          for (let i = 0; i < positionAttr.count; i++) {
            vertices[i * 3] = positionAttr.getX(i);
            vertices[i * 3 + 1] = positionAttr.getY(i);
            vertices[i * 3 + 2] = positionAttr.getZ(i);
          }

          let indices;
          if (geo.index) {
            indices = new Uint32Array(geo.index.array);
          } else {
            // Non-indexed: generate sequential indices
            indices = new Uint32Array(positionAttr.count);
            for (let i = 0; i < positionAttr.count; i++) indices[i] = i;
          }

          rigidBodyDesc = makeRigidBody();
          colliderDesc = RAPIER.ColliderDesc.trimesh(vertices, indices);

        } else {
          throw new Error(`Unknown collider type: "${type}"`);
        }

        const rigidBody = world.createRigidBody(rigidBodyDesc);
        const collider = world.createCollider(colliderDesc, rigidBody);

        mesh.userData.RB = rigidBody
        mesh.userData.COLLIDER = collider

        physicsIDs += 1
        const ID = physicsIDs
        mesh.userData.ID = ID

        const physicsObject = { RB: rigidBody, COLLIDER: collider, MESH: mesh, ID: ID }
        physicsObjects.push(physicsObject);

        return physicsObject;
      }

      const debugRayGroup = new THREE.Group();

      const dir = new THREE.Vector3();

      const occlusionRaycaster = new THREE.Raycaster();

      function getPercentageVisible(mesh, showDebug = false) {

        const occluders = IST.scene.children.filter(obj => obj !== mesh && obj !== debugRayGroup);

        const samplePoints = mesh.userData.propVisibleData.SAMPLE_POINTS;

        IST.camera.getWorldPosition(cameraPos);

        let visible = 0;

        if (showDebug) {
          debugRayGroup.clear();
        }

        for (const localPoint of samplePoints) {

          worldPoint.copy(localPoint).applyMatrix4(mesh.matrixWorld);

          dir.subVectors(worldPoint, cameraPos).normalize();

          const dist = cameraPos.distanceTo(worldPoint);

          occlusionRaycaster.set(cameraPos, dir);
          occlusionRaycaster.far = dist - 0.01;

          const hits = occlusionRaycaster.intersectObjects(
            occluders,
            true
          );

          const isVisible = hits.length === 0;

          if (isVisible) {
            visible++;
          }

          if (showDebug) {

            const geometry = new THREE.BufferGeometry()
              .setFromPoints([
                cameraPos.clone(),
                worldPoint.clone()
              ]);

            const material = new THREE.LineBasicMaterial({
              color: isVisible ? 0x00ff00 : 0xff0000
            });

            debugRayGroup.add(
              new THREE.Line(geometry, material)
            );
          }
        }

        return {
          visibilityRatio: visible / samplePoints.length,
          visible,
          total: samplePoints.length
        };
      }

      function createPhysicsObjectOld(mesh, spawnPosition, mass = null) {
        mesh.geometry.computeBoundingBox();
        const size = new THREE.Vector3();
        mesh.geometry.boundingBox.getSize(size);
        size.divideScalar(2);

        let rigidBodyDesc = RAPIER.RigidBodyDesc.dynamic()
          .setTranslation(spawnPosition.x, spawnPosition.y, spawnPosition.z);

        rigidBodyDesc.setRotation({
          x: mesh.quaternion.x,
          y: mesh.quaternion.y,
          z: mesh.quaternion.z,
          w: mesh.quaternion.w
        }, true);

        rigidBodyDesc.setCcdEnabled(true);

        let colliderDesc = RAPIER.ColliderDesc.cuboid(size.x, size.y, size.z)

        if (mass) {
          colliderDesc.setDensity(0);
        }

        const rigidBody = world.createRigidBody(rigidBodyDesc);
        const collider = world.createCollider(colliderDesc, rigidBody);

        if (mass) {
          rigidBody.setAdditionalMass(mass, true);
        }

        mesh.position.copy(rigidBody.translation());
        mesh.quaternion.copy(rigidBody.rotation());
        mesh.userData.RB = rigidBody
        mesh.userData.COLLIDER = collider

        physicsIDs += 1
        const ID = physicsIDs
        mesh.userData.ID = ID

        const physicsObject = { RB: rigidBody, COLLIDER: collider, MESH: mesh, ID: ID }
        physicsObjects.push(physicsObject);

      function mouseToWorld(distanceTarget = null) {
        // distanceTarget determines how far away from the camera this position will be

        // Set world pointer to be x and y NDC 
        worldPointer.set(pointer.x, pointer.y, 0)

        // Convert NDC to world - This places the object at the position of the camera
        worldPointer.unproject(IST.camera);

        // Subtract the camera position from it
        worldPointer.sub(IST.camera.position).normalize();

        // Calculate how far away the object is 
        let distance
        if (distanceTarget == null) {
          // If no object provided, place the object at the zero point of the scene
          distance = IST.camera.position.length()
        } else {
          // Else maintain its current distance
          distance = IST.camera.position.distanceTo(distanceTarget)
        }

        // Add this distance to the coords
        worldPointer.multiplyScalar(distance)

        // Create final position
        worldPosition.copy(IST.camera.position).add(worldPointer)

        return (worldPosition);

      }

      function getBoxSurfaceSamplesWorld(model, numSamples) {
        const { LOCAL_BOX, FACES } = model.userData.propVisibleData;

        model.updateWorldMatrix(true, false);
        const worldBox = LOCAL_BOX.clone().applyMatrix4(model.matrixWorld);

        const size = new THREE.Vector3();
        worldBox.getSize(size);
        const half = { x: size.x / 2, y: size.y / 2, z: size.z / 2 };
        const center = worldBox.getCenter(new THREE.Vector3());

        const points = [];
        const normals = [];

        const perFace = Math.max(1, Math.round(numSamples / 6));
        const grid = Math.max(1, Math.ceil(Math.sqrt(perFace)));

        FACES.forEach(face => {
          for (let i = 0; i < grid; i++) {
            for (let j = 0; j < grid; j++) {
              const u = -half[face.du] + ((i + 0.5) / grid) * 2 * half[face.du];
              const v = -half[face.dv] + ((j + 0.5) / grid) * 2 * half[face.dv];

              const p = new THREE.Vector3();
              p[face.axis] = face.sign * half[face.axis];
              p[face.du] = u;
              p[face.dv] = v;
              p.add(center);

              const n = new THREE.Vector3();
              n[face.axis] = face.sign;

              points.push(p);
              normals.push(n);
            }
          }
        });

        return { points, normals };
      }

      function getSphereSurfaceSamplesWorld(sphere, numSamples) {
        const points = [];
        const normals = [];
        const { center, radius } = sphere;

        for (let i = 0; i < numSamples; i++) {
          const theta = Math.acos(1 - (2 * (i + 0.5)) / numSamples);
          const phi = Math.PI * (1 + Math.sqrt(5)) * i;

          const local = new THREE.Vector3(
            radius * Math.sin(theta) * Math.cos(phi),
            radius * Math.sin(theta) * Math.sin(phi),
            radius * Math.cos(theta)
          );
          points.push(local.clone().add(center));
          normals.push(local.clone().normalize());
        }

        return { points, normals };
      }

      function getVisibilityPercentage(target, scene, numSamples = 16, boundsType = 'box') {
        let visibleSamples = 0;

        const box = new THREE.Box3().setFromObject(target);
        const size = new THREE.Vector3();
        box.getSize(size);
        const charSize = Math.max(size.x, size.y, size.z) || 1;

        const { points: samplePoints, normals } = getBoxSurfaceSamplesWorld(target, numSamples);

        // GLBs are groups with multiple meshes, so "self" is now a set, not one mesh
        const targetMeshes = new Set();
        target.traverse(o => { if (o.isMesh) targetMeshes.add(o); });

        for (let i = 0; i < samplePoints.length; i++) {
          const samplePoint = samplePoints[i];
          const normal = normals[i];

          const toCam = IST.camera.position.clone().sub(samplePoint).normalize();
          if (normal.dot(toCam) < 0) continue;

          const dir = toCam;
          const nudge = dir.clone().multiplyScalar(charSize * 0.01);
          const rayOrigin = samplePoint.clone().add(nudge);

          raycaster.set(rayOrigin, dir);
          const hits = raycaster.intersectObjects(scene.children.filter(c => !c.userData.debugRay), true);

          const isVisible = hits.length === 0 || targetMeshes.has(hits[0].object);
          if (isVisible) visibleSamples++;

        }
        return visibleSamples / samplePoints.length;
      }

          }
